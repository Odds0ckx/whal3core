<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whal3Core Page Loader</title>
<!--
  Whal3Core page loader

  A full-screen overlay: the Whal3Core mark with #487197 rings rippling out
  from its circle. It loops forever; show it while your page loads and
  remove the element when the page is ready. Plain HTML and CSS, no JS and
  no dependencies.

  To use it, copy the <style> block and the .page-loader element.

  Customise at the top of the CSS:
    --loader-ink    ring and mark colour (#487197)
    --loader-bg     overlay colour; match your page background (#eef1f5)
    --loader-size   size of the mark (72px); the rings scale with it

  Accessibility: role="status" with the visually hidden text "Loading
  Whal3Core". With prefers-reduced-motion the rings hold still as a static
  halo.
-->
<style>
.page-loader {
  --loader-ink: #487197;
  --loader-bg: #eef1f5;
  --loader-size: 72px;
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: grid;
  place-items: center;
  background: var(--loader-bg);
}
.page-loader-stage {
  position: relative;
  width: var(--loader-size);
  height: var(--loader-size);
  color: var(--loader-ink);
}
/* Each ring starts at the mark's own circle and drifts outward, easing off
   as it fades. Negative delays put all three in flight on first paint. */
.page-loader-ring {
  position: absolute;
  inset: 6%;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  background: rgba(72, 113, 151, 0.07); /* --loader-ink at 7% */
  opacity: 0;
  animation: page-loader-ripple 2.7s cubic-bezier(0.33, 1, 0.68, 1) infinite;
}
.page-loader-ring:nth-child(2) {
  animation-delay: -0.9s;
}
.page-loader-ring:nth-child(3) {
  animation-delay: -1.8s;
}
.page-loader-mark {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  animation: page-loader-breathe 2.7s cubic-bezier(0.65, 0, 0.35, 1) infinite;
}
.page-loader-label {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
@keyframes page-loader-ripple {
  0% {
    transform: scale(0.95);
    opacity: 0;
  }
  8% {
    opacity: 0.55;
  }
  100% {
    transform: scale(3.1);
    opacity: 0;
  }
}
@keyframes page-loader-breathe {
  0%,
  100% {
    transform: scale(1);
  }
  50% {
    transform: scale(0.96);
  }
}
/* Reduced motion: hold the rings still as a static halo. */
@media (prefers-reduced-motion: reduce) {
  .page-loader-ring,
  .page-loader-mark {
    animation: none;
  }
  .page-loader-ring:nth-child(1) {
    transform: scale(1.5);
    opacity: 0.4;
  }
  .page-loader-ring:nth-child(2) {
    transform: scale(2.1);
    opacity: 0.24;
  }
  .page-loader-ring:nth-child(3) {
    transform: scale(2.7);
    opacity: 0.12;
  }
}
</style>
</head>
