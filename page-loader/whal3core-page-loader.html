<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whal3Core Page Loader</title>
<!--
  ==========================================================================
  Whal3Core page loader: developer handoff
  ==========================================================================
  A full-screen splash: the Whal3Core mark with #487197 rings rippling out
  from its circle. It covers the page until the window "load" event, stays
  up for at least 1.4s so it never just flashes, then fades out and removes
  itself. No dependencies: plain HTML, CSS and ~30 lines of JS.

  Open this file in a browser to see it. Once it fades, the demo page has a
  "Replay loader" button.

  TO INTEGRATE, copy the three blocks marked "PAGE LOADER" in this file:
    1. CSS     -> into your stylesheet (or a <style> in <head>).
    2. Script  -> inline in <head>, so html.is-loading is set before first
                  paint. The loader is hidden unless that class is set, so a
                  visitor with JS off never gets stuck behind it.
    3. Markup  -> the first element inside <body>.
  Ignore everything marked "DEMO ONLY".

  Customising (all at the top of the CSS block):
    --loader-ink    ring and mark colour (#487197)
    --loader-bg     overlay colour; match your page background (#eef1f5)
    --loader-size   size of the mark (72px); the rings scale with it
  Timing (top of the script block): MIN_MS (1400) is the shortest the
  loader shows; MAX_MS (8000) is a safety net that hides it even if "load"
  never fires.

  Hooks:
    window.pageLoader.hide()  hides it early, e.g. once an SPA has its data.
    "pageloader:done"         event fired on document as the fade starts.
                              Start entrance animations on it so they play
                              in view instead of behind the loader.
                              With GSAP:
                                if (document.documentElement.classList.contains("is-loading")) {
                                  gsap.globalTimeline.pause();
                                  document.addEventListener("pageloader:done", function () {
                                    gsap.globalTimeline.resume();
                                  });
                                }

  Accessibility: the overlay is role="status" with the visually hidden text
  "Loading Whal3Core". With prefers-reduced-motion the rings hold still as a
  static halo and the loader hides as soon as the page has loaded.
  ==========================================================================
-->
<style>
/* ======================= PAGE LOADER: CSS (copy) ======================= */
.page-loader {
  --loader-ink: #487197;
  --loader-bg: #eef1f5;
  --loader-size: 72px;
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  place-items: center;
  background: var(--loader-bg);
  transition:
    opacity 0.75s cubic-bezier(0.33, 1, 0.68, 1),
    visibility 0s linear 0.75s;
}
/* Lock scrolling underneath; the gutter stops the layout jumping when the
   scrollbar comes back. */
html.is-loading {
  overflow: hidden;
  scrollbar-gutter: stable;
}
.is-loading .page-loader,
.page-loader.is-done {
  display: grid;
}
.page-loader.is-done {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.page-loader-stage {
  position: relative;
  width: var(--loader-size);
  height: var(--loader-size);
  color: var(--loader-ink);
  transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
}
.page-loader.is-done .page-loader-stage {
  transform: scale(1.12);
}
/* Each ring starts at the mark's own circle and drifts outward, easing off
   as it fades. Negative delays put all three in flight on first paint. */
.page-loader-ring {
  position: absolute;
  inset: 6%;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  background: rgba(72, 113, 151, 0.07); /* --loader-ink at 7% */
  opacity: 0;
  animation: page-loader-ripple 2.7s cubic-bezier(0.33, 1, 0.68, 1) infinite;
}
.page-loader-ring:nth-child(2) {
  animation-delay: -0.9s;
}
.page-loader-ring:nth-child(3) {
  animation-delay: -1.8s;
}
.page-loader-mark {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  animation: page-loader-breathe 2.7s cubic-bezier(0.65, 0, 0.35, 1) infinite;
}
.page-loader-label {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
@keyframes page-loader-ripple {
  0% {
    transform: scale(0.95);
    opacity: 0;
  }
  8% {
    opacity: 0.55;
  }
  100% {
    transform: scale(3.1);
    opacity: 0;
  }
}
@keyframes page-loader-breathe {
  0%,
  100% {
    transform: scale(1);
  }
  50% {
    transform: scale(0.96);
  }
}
/* Reduced motion: hold the rings still as a static halo; the loader still
   fades out, but without the scale. */
@media (prefers-reduced-motion: reduce) {
  .page-loader-stage,
  .page-loader.is-done .page-loader-stage {
    transform: none;
    transition: none;
  }
  .page-loader-ring,
  .page-loader-mark {
    animation: none;
  }
  .page-loader-ring:nth-child(1) {
    transform: scale(1.5);
    opacity: 0.4;
  }
  .page-loader-ring:nth-child(2) {
    transform: scale(2.1);
    opacity: 0.24;
  }
  .page-loader-ring:nth-child(3) {
    transform: scale(2.7);
    opacity: 0.12;
  }
}
/* ========================= end PAGE LOADER: CSS ======================== */

/* ============================== DEMO ONLY ============================== */

<!-- ===================== PAGE LOADER: script (copy) ===================== -->
<script>
(function () {
  var MIN_MS = 1400; /* shortest time on screen, so it never just flashes */
  var MAX_MS = 8000; /* hide regardless, if "load" is held up */

  var root = document.documentElement;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var hidden = false;

  root.classList.add("is-loading");

  function hide() {
    if (hidden) return;
    hidden = true;
    root.classList.remove("is-loading");
    var loader = document.getElementById("pageLoader");
    if (loader) {
      loader.classList.add("is-done");
      setTimeout(function () {
        loader.remove();
      }, 900);
    }
    document.dispatchEvent(new CustomEvent("pageloader:done"));
  }

  window.pageLoader = { hide: hide };
  window.addEventListener("load", function () {
    setTimeout(hide, Math.max(0, (reduced ? 0 : MIN_MS) - performance.now()));
  });
  setTimeout(hide, MAX_MS);
})();
</script>
<!-- ======================= end PAGE LOADER: script ====================== -->

<script>
/* Demo only: puts a copy of the loader back and holds it for 3.5s. */
(function () {
  var template = document.getElementById("pageLoader").cloneNode(true);
  var root = document.documentElement;
  document.getElementById("replay").addEventListener("click", function () {
    if (document.getElementById("pageLoader")) return;
    var loader = template.cloneNode(true);
    document.body.insertBefore(loader, document.body.firstChild);
    root.classList.add("is-loading");
    setTimeout(function () {
      root.classList.remove("is-loading");
      loader.classList.add("is-done");
      setTimeout(function () {
        loader.remove();
      }, 900);
    }, 3500);
  });
})();
</script>
